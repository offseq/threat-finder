[package]
name = "threat-finder"
version = "0.2.1"
edition = "2021"
rust-version = "1.87"
description = "Runtime vulnerability scanner: finds CVEs in the services and packages actually present on a host and flags which are network-exposed"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/offseq/threat-finder"
homepage = "https://radar.offseq.com"
documentation = "https://docs.rs/threat-finder"
keywords = ["security", "vulnerability", "cve", "scanner", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "/*.svg"]

# `cargo binstall threat-finder` fetches the prebuilt release archives instead
# of compiling. Matches the artifact names produced by .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/threat-finder-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# Windows release archives are .zip (taiki-e/upload-rust-binary-action default).
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/threat-finder-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[lib]
name = "find_threats"
path = "src/lib.rs"

[[bin]]
name = "threat-finder"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
rpassword = "7"
uuid = { version = "1", features = ["v4"] }

# systemd discovery is Linux-only; D-Bus (zbus) doesn't belong on macOS/Windows
# builds (and its Windows transport deps don't build cleanly), so gate it here.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
