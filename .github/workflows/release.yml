name: Release

# Tag a release to build cross-platform binaries, attach them to the GitHub
# Release, and publish to crates.io:
#   cargo set-version 0.1.0   # or bump Cargo.toml
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  binaries:
    name: build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-apple-darwin,       os: macos-latest }
          - { target: aarch64-apple-darwin,      os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: threat-finder
          target: ${{ matrix.target }}
          archive: threat-finder-$tag-$target
          checksum: sha256
          include: README.md,LICENSE,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: publish to crates.io
    needs: [create-release, binaries]  # don't publish if any archive failed to build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret not set — skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked --token "$TOKEN"

  update-homebrew:
    name: bump homebrew tap
    needs: binaries  # wait until release assets + checksums exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump formula in offseq/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping Homebrew bump."
            exit 0
          fi
          tag="$GITHUB_REF_NAME"; ver="${tag#v}"
          mkdir -p sums
          for t in aarch64-apple-darwin x86_64-apple-darwin \
                   aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "threat-finder-$tag-$t.sha256" --dir sums --clobber
          done
          sha() { awk '{print $1}' "sums/threat-finder-$tag-$1.sha256"; }
          formula="$(sed \
            -e "s/__VERSION__/$ver/g" \
            -e "s/__SHA_MAC_ARM__/$(sha aarch64-apple-darwin)/" \
            -e "s/__SHA_MAC_X86__/$(sha x86_64-apple-darwin)/" \
            -e "s/__SHA_LIN_ARM__/$(sha aarch64-unknown-linux-gnu)/" \
            -e "s/__SHA_LIN_X86__/$(sha x86_64-unknown-linux-gnu)/" \
            packaging/homebrew/threat-finder.rb.tmpl)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/offseq/homebrew-tap" tap
          mkdir -p tap/Formula
          printf '%s\n' "$formula" > tap/Formula/threat-finder.rb
          cd tap
          git config user.name "offseq-bot"
          git config user.email "noreply@offseq.com"
          git add Formula/threat-finder.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "threat-finder $ver"
          git push
